[project]
name = "obsidian-personal-agent-local-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpcore>=1,<2", "httpx>=0.28,<0.29", "httpx2>=2.5,<3", "mcp>=2,<3", "PyYAML>=6,<7", "tomlkit>=0.13,<1", "trafilatura>=2.1,<3"]

[project.optional-dependencies]
package = ["pyinstaller>=6,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
