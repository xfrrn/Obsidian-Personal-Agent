[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "obsidian-knowledge-agent-operation-adapters"
version = "0.1.0"
description = "Reference adapters for safe Operation Plan execution"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Obsidian Knowledge Agent" }]
dependencies = [
  "obsidian-knowledge-agent-domain>=0.1.0",
  "obsidian-knowledge-agent-application>=0.1.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
